# Builds wuxia-local.exe, bundles llama-server (Vulkan + CPU) and produces the
# Windows installer. Push a tag like v0.1.0 to publish a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp release tag (empty = latest)"
        required: false

permissions:
  contents: write
  actions: write # delete old build artifacts

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo test -p wuxia-core

  windows:
    runs-on: windows-latest
    needs: core-tests
    env:
      GH_TOKEN: ${{ github.token }}
      # ocr-rs generates its MNN bindings with bindgen (needs libclang).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      OCR_RS_TAG: v2.4.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Pinned downloads (MNN for PaddleOCR)
        shell: pwsh
        run: |
          # ci/pins.env → environment for the next steps.
          Get-Content ci/pins.env | Where-Object { $_ -match '^[A-Z_0-9]+=' } | ForEach-Object { $_ | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          $pins = @{}; Get-Content ci/pins.env | Where-Object { $_ -match '^([A-Z_0-9]+)=(.*)$' } | ForEach-Object { $pins[$Matches[1]] = $Matches[2].Trim() }
          # ocr-rs takes MNN from a release that can be replaced at any time: compare its digest.
          $q = '.assets[] | select(.name == "' + $pins.MNN_ASSET + '") | .digest'
          $digest = gh api repos/zibo-chen/MNN-Prebuilds/releases/tags/dev --jq $q
          $sha = "$digest".Replace('sha256:', '')
          Write-Host "MNN $($pins.MNN_ASSET): $sha"
          if ([string]::IsNullOrEmpty($sha)) { Write-Host "::warning::MNN asset $($pins.MNN_ASSET) not found in the release metadata" }
          elseif ([string]::IsNullOrEmpty($pins.MNN_SHA256)) { Write-Host "::warning::MNN_SHA256 is not pinned yet; current: $sha" }
          elseif ($sha -ne $pins.MNN_SHA256) { throw "MNN prebuilt changed upstream ($sha, pinned $($pins.MNN_SHA256)). Check it, then update ci/pins.env." }

      - name: Test core
        run: cargo test -p wuxia-core

      - name: Clippy
        run: cargo clippy -p wuxia-local --release -- -D clippy::correctness

      - name: Build
        shell: pwsh
        run: |
          # Build date (Moscow time) and commit, shown in the panel and the log.
          $msk = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).ToUniversalTime(), 'Russian Standard Time')
          $env:WUXIA_BUILD = "$($msk.ToString('dd.MM.yyyy HH:mm')) · $($env:GITHUB_SHA.Substring(0,7))"
          cargo build -p wuxia-local --release

      - name: Download llama.cpp (Vulkan + CPU)
        shell: pwsh
        run: |
          # The input (manual run) wins; otherwise the version pinned in ci/pins.env.
          $tag = "${{ github.event.inputs.llama_tag }}"
          $pinned = [string]::IsNullOrEmpty($tag)
          if ($pinned) { $tag = $env:LLAMA_TAG }
          Write-Host "llama.cpp $tag"
          New-Item -ItemType Directory -Force dist/llama-vulkan, dist/llama-cpu | Out-Null
          gh release download $tag --repo ggml-org/llama.cpp --pattern "*bin-win-vulkan-x64.zip" --dir dl
          gh release download $tag --repo ggml-org/llama.cpp --pattern "*bin-win-cpu-x64.zip" --dir dl
          if ($pinned) {
            foreach ($k in @(@("vulkan", $env:LLAMA_VULKAN_SHA256), @("cpu", $env:LLAMA_CPU_SHA256))) {
              $sha = (Get-FileHash (Get-ChildItem "dl/*bin-win-$($k[0])-x64.zip").FullName -Algorithm SHA256).Hash.ToLower()
              Write-Host "llama.cpp $($k[0]): $sha"
              if ([string]::IsNullOrEmpty($k[1])) { Write-Host "::warning::llama.cpp $($k[0]) checksum is not pinned yet; current: $sha" }
              elseif ($sha -ne $k[1].ToLower()) { throw "llama.cpp $tag $($k[0]) archive differs from ci/pins.env ($sha)" }
            }
          }
          Expand-Archive (Get-ChildItem dl/*vulkan-x64.zip).FullName -DestinationPath dist/llama-vulkan
          Expand-Archive (Get-ChildItem dl/*cpu-x64.zip).FullName -DestinationPath dist/llama-cpu
          # Some releases nest binaries in a subfolder: flatten.
          foreach ($d in "dist/llama-vulkan","dist/llama-cpu") {
            $exe = Get-ChildItem $d -Recurse -Filter llama-server.exe | Select-Object -First 1
            if (-not $exe) { throw "llama-server.exe not found in $d" }
            if ($exe.DirectoryName -ne (Resolve-Path $d).Path) { Move-Item "$($exe.DirectoryName)/*" $d -Force }
            # Only llama-server and its DLLs are used: drop the other ~20 tools (~16 MB).
            Get-ChildItem $d -Recurse -Filter *.exe | Where-Object Name -ne 'llama-server.exe' | Remove-Item -Force
          }
          "$tag" | Out-File dist/LLAMA_VERSION.txt

      - name: PaddleOCR models (PP-OCRv6 small)
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:OCR_RS_TAG https://github.com/zibo-chen/rust-paddle-ocr dl/ocr-rs
          New-Item -ItemType Directory -Force dist/ocr | Out-Null
          foreach ($f in "PP-OCRv6_small_det.mnn","PP-OCRv6_small_rec.mnn","ppocr_keys_v6_small.txt") {
            Copy-Item "dl/ocr-rs/models/$f" dist/ocr/
          }
          Copy-Item dl/ocr-rs/LICENSE dist/ocr/LICENSE-ocr-rs.txt
          Get-ChildItem dist/ocr | Format-Table Name, Length

      - name: Stage files
        shell: pwsh
        run: |
          Copy-Item target/release/wuxia-local.exe dist/
          Copy-Item assets/config.default.toml dist/
          Copy-Item -Recurse assets/glossary dist/glossary
          Copy-Item -Recurse assets/bench dist/bench
          Copy-Item -Recurse assets/dict dist/dict
          Copy-Item README.md, LICENSE dist/

      - name: Windows OCR for English (for the screenshot tests)
        shell: pwsh
        continue-on-error: true
        run: |
          Get-WindowsCapability -Online -Name "Language.OCR*en-US*" | Format-Table Name, State
          Get-WindowsCapability -Online -Name "Language.OCR*en-US*" | Where-Object State -ne Installed | Add-WindowsCapability -Online

      - name: Screenshot tests (PaddleOCR, Windows OCR and both on tests/screens)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\wuxia-local.exe -ArgumentList '--selftest','tests\screens','--out','selftest-report.md' -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          if (Test-Path selftest-report.md) { Get-Content selftest-report.md }
          if ($p.ExitCode -eq 2) { Write-Host "::warning::OCR is not available on the runner - screenshot tests skipped"; exit 0 }
          exit $p.ExitCode

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/WuxiaLocal | Out-Null
          Copy-Item dist/* portable/WuxiaLocal -Recurse -Exclude llama-vulkan,llama-cpu
          Copy-Item -Recurse dist/llama-vulkan portable/WuxiaLocal/llama
          "portable" | Out-File portable/WuxiaLocal/portable.txt
          Compress-Archive portable/WuxiaLocal WuxiaLocal-portable-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DDist=$PWD\dist" installer\wuxia-local.iss
          Get-ChildItem installer/Output

      - name: Cargo.lock (exact dependency versions)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: wuxia-local-windows
          path: |
            installer/Output/*.exe
            WuxiaLocal-portable-x64.zip
            selftest-report.md

      - name: Keep only the 5 newest builds
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ids = gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100&name=wuxia-local-windows" --jq '.artifacts | sort_by(.created_at) | reverse | .[5:] | .[].id'
          foreach ($id in $ids) { if ($id) { gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; Write-Host "deleted artifact $id" } }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            WuxiaLocal-portable-x64.zip
